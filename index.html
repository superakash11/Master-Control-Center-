<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Music Player</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0b0b0f;
    font-family: Arial, sans-serif;
    color: white;
}

.music-box {
    width: 90%;
    max-width: 420px;
    padding: 25px;
    border-radius: 20px;
    background: #15151d;
    box-shadow: 0 0 30px rgba(0,0,0,.5);
    text-align: center;
}

.music-title {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 8px;
}

.song-name {
    font-size: 15px;
    opacity: .7;
    margin-bottom: 22px;
    min-height: 20px;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
}

.controls button {
    border: none;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: #24242f;
    color: white;
    font-size: 22px;
    cursor: pointer;
    transition: .2s;
}

.controls button:hover {
    transform: scale(1.08);
    background: #343443;
}

.play-btn {
    width: 65px !important;
    height: 65px !important;
    font-size: 26px !important;
}

.volume-box {
    margin-top: 22px;
}

.volume-box input {
    width: 100%;
}
</style>
</head>

<body>

<div class="music-box">

    <div class="music-title">
        🎵 Music Player
    </div>

    <div class="song-name" id="songName">
        Song 1
    </div>

    <div class="controls">

        <!-- Previous -->
        <button onclick="previousSong()" title="Previous Song">
            ⏮️
        </button>

        <!-- Play / Pause -->
        <button class="play-btn" id="playBtn" onclick="togglePlay()" title="Play / Pause">
            ▶️
        </button>

        <!-- Change Song -->
        <button onclick="nextSong()" title="Change Song">
            ⏭️
        </button>

    </div>

    <div class="volume-box">
        🔊
        <input
            type="range"
            id="volume"
            min="0"
            max="1"
            step="0.01"
            value="1"
            onchange="changeVolume()"
        >
    </div>

</div>

<audio id="audio"></audio>

<script>

/* =====================================
   SONG LIST
===================================== */

const songs = [
    {
        name: "Song 1",
        file: "song.mp3"
    },
    {
        name: "Song 2",
        file: "song2.mp3"
    }
];


/* =====================================
   PLAYER VARIABLES
===================================== */

let currentSong = 0;

const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");
const songName = document.getElementById("songName");
const volume = document.getElementById("volume");


/* =====================================
   LOAD SONG
===================================== */

function loadSong(index, autoPlay = false) {

    currentSong = index;

    audio.src = songs[currentSong].file;

    songName.innerText = songs[currentSong].name;

    audio.load();

    if (autoPlay) {
        audio.play()
            .then(() => {
                playBtn.innerText = "⏸️";
            })
            .catch(() => {
                playBtn.innerText = "▶️";
            });
    } else {
        playBtn.innerText = "▶️";
    }
}


/* =====================================
   PLAY / PAUSE
===================================== */

function togglePlay() {

    if (audio.paused) {

        audio.play()
            .then(() => {
                playBtn.innerText = "⏸️";
            })
            .catch(() => {
                alert("Song play nahi ho raha. Check karo song.mp3 same folder mein hai.");
            });

    } else {

        audio.pause();

        playBtn.innerText = "▶️";
    }
}


/* =====================================
   NEXT / CHANGE SONG
===================================== */

function nextSong() {

    currentSong++;

    if (currentSong >= songs.length) {
        currentSong = 0;
    }

    loadSong(currentSong, true);
}


/* =====================================
   PREVIOUS SONG
===================================== */

function previousSong() {

    currentSong--;

    if (currentSong < 0) {
        currentSong = songs.length - 1;
    }

    loadSong(currentSong, true);
}


/* =====================================
   AUTO NEXT
===================================== */

audio.addEventListener("ended", function() {

    currentSong++;

    if (currentSong >= songs.length) {
        currentSong = 0;
    }

    loadSong(currentSong, true);

});


/* =====================================
   VOLUME
===================================== */

function changeVolume() {
    audio.volume = volume.value;
}


/* =====================================
   INITIAL SONG
===================================== */

audio.volume = 1;

loadSong(0, false);

</script>

</body>
</html>
